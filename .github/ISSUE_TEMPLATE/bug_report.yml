name: Bug report
description: Report a reproducible problem with RiftPvP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RiftPvP version
      placeholder: e.g. 1.3.4-SNAPSHOT
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and version
      placeholder: e.g. Paper 26.1.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove IP addresses, tokens, passwords, and other sensitive information before posting.
