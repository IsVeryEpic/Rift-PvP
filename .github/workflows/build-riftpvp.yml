name: Build RiftPvP 1.3.4
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Java 25 / Paper API compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          FILE="4_GiovanniCampos_RiftPvP-1.3.4-STAGE4-SOURCE.zip"
          if [[ ! -f "$FILE" ]]; then
            echo "::error::Upload $FILE to the repository root first (Add file > Upload files)."
            exit 1
          fi
          mkdir -p build-src
          unzip -q "$FILE" -d build-src
          test -f build-src/riftpvp_final_work/pom.xml
      - name: Compile plugin
        shell: bash
        run: mvn --batch-mode --no-transfer-progress --file build-src/riftpvp_final_work/pom.xml clean package
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RiftPvP-1.3.4-SNAPSHOT-UNTESTED
          path: build-src/riftpvp_final_work/target/*.jar
          if-no-files-found: error
