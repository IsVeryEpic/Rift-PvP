name: Build RiftPvP (Paper 26.1.2)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile against Paper API
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify plugin resources
        run: |
          jar tf target/RiftPvP-1.3.4-SNAPSHOT.jar | grep -qx plugin.yml
          jar tf target/RiftPvP-1.3.4-SNAPSHOT.jar | grep -qx dev/riftpvp/PracticeFeatures.class
          jar tf target/RiftPvP-1.3.4-SNAPSHOT.jar | grep -qx dev/riftpvp/FightAnalytics.class
      - name: Run source safety audits
        run: |
          python -m pip install --quiet pyyaml
          python tools/static_audit.py
          python tools/stage7_audit.py
          python tools/stage8_audit.py
          python tools/test_postmatch_ui.py
          python tools/test_ranked_match_protection.py
          python tools/test_fight_spawn_spacing.py
      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: RiftPvP-1.3.4-Paper-26.1.2-TEST-BUILD
          path: target/RiftPvP-1.3.4-SNAPSHOT.jar
          if-no-files-found: error
