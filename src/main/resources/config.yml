# Exact IDs match the supplied KitsCratesPlus filenames, including "sheildaxe".
# You can change icons, names, slots and enable/disable kits here, or set a custom
# icon in game using /riftpvp kit icon <id> while holding the desired icon.
kits:
  diamondsmp: {enabled: true, name: 'Diamond SMP', icon: DIAMOND_CHESTPLATE, glow: false, slot: 10}
  earlygame: {enabled: true, name: 'Early Game', icon: GOLDEN_APPLE, glow: false, slot: 11}
  endgame: {enabled: true, name: 'End Game', icon: TOTEM_OF_UNDYING, glow: false, slot: 12}
  htk: {enabled: true, name: 'HTK', icon: TNT_MINECART, glow: true, slot: 13}
  lategame: {enabled: true, name: 'Late Game', icon: NETHERITE_CHESTPLATE, glow: false, slot: 14}
  ltk: {enabled: true, name: 'LTK', icon: TNT_MINECART, glow: false, slot: 15}
  mace: {enabled: true, name: 'Mace', icon: MACE, glow: false, slot: 16}
  moneysmp: {enabled: true, name: 'Money SMP', icon: EMERALD, glow: false, slot: 19}
  nethpot: {enabled: true, name: 'NethPot', icon: NETHERITE_HELMET, glow: false, slot: 20}
  pot: {enabled: true, name: 'Pot', icon: SPLASH_POTION, potion: HEALING, glow: false, slot: 21}
  sheildaxe: {enabled: true, name: 'Shield Axe', icon: NETHERITE_AXE, glow: false, slot: 22}
  smp: {enabled: true, name: 'SMP', icon: ENDER_PEARL, glow: false, slot: 23}
  spearmace: {enabled: true, name: 'Spear Mace', icon: NETHERITE_SPEAR, glow: false, slot: 24}
  sword: {enabled: true, name: 'Sword', icon: DIAMOND_SWORD, glow: false, slot: 25}

lobby-features-note: "Kit Room and VIP perks use plugins/RiftPvP persistent storage."

ranked:
  # Ranked fights only. Never changes /rtp, RTPQ, or casual duels.
  allowed-biomes: [PLAINS, SUNFLOWER_PLAINS]
  # Additional retries to find a safe, loaded Plains fight location.
  location-retries: 32
  integrity:
    enabled: true
    window-minutes: 60
    flag-after-matches: 4
    suppress-repeat-elo: false
  matchmaking:
    initial-elo-gap: 150
    elo-gap-per-15s: 50
    maximum-elo-gap: 600
    # Avoid infinite waits in low-population Ranked queues.
    allow-any-elo-after-seconds: 60
    # Casual /queueprefs ping limits do not stop Ranked from pairing by default.
    respect-ping-preferences: false
  placements: 5
  tier-base-elo: 1000
  tier-step: 100
  penalties:
    enabled: true
    decay-hours: 24

match-records:
  retention: 5000
rekit-alerts:
  radius: 48
features:
  tpa: true
  ranked: true
  rekit-alerts: true

# Opt-in Discord notifications. Keep the webhook URL secret and do not share config.yml.
discord:
  enabled: false
  webhook-url: ''
  events:
    ranked-results: true
    integrity: true
    reports: true
    staff-actions: true


# Stage 8: scheduled, bounded plugin-data snapshots in plugins/RiftPvP/backups.
# These ZIP archives include config.yml, including any configured webhook credentials.
# Keep the backups folder private and backed up off-server when appropriate.
backups:
  enabled: true
  interval-minutes: 120
  keep: 10
  max-size-mb: 128

# Players reconnecting during grace resume; when it expires the opponent wins.
# Reconnect pauses an interrupted active fight for a short, configurable grace period.
reconnect:
  enabled: true
  grace-seconds: 25

maintenance:
  enabled: false
  block-new-joins: false

tutorial:
  enabled: true

custom-kits:
  allow-unsafe-enchants: false
  allow-persistent-custom-data: true # Verified against the original trusted server-kit ItemMeta on load
  forbidden-materials: []

# Individual kit controls: all modes default true for existing configurations.
# Staff can use /kitmodes <kit> ranked|queue|duel|custom on|off.
